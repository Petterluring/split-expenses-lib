
on:
  push:
    branches:
      - 'feature/**'
      - 'dev'
      - 'main'

jobs:
  gradle_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with gradle
        run: ./gradlew build